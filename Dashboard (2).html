// LOGIN
async function login() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");

    if (!email || !password) {
        message.innerHTML = "⚠️ Please enter your email and password.";
        return;
    }

    message.innerHTML = "⏳ Logging in...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {
        message.innerHTML = "❌ " + error.message;
        return;
    }

    message.innerHTML = "✅ Login successful!";

    setTimeout(() => {
        showDashboard();
    }, 500);
}


// SHOW SIGNUP
function showSignup() {

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("signupBox").style.display = "block";
}


// SHOW LOGIN
function showLogin() {

    document.getElementById("signupBox").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
}


// CREATE ACCOUNT
async function createAccount() {

    const name =
        document.getElementById("artistName").value.trim();

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("signupMessage");


    if (!name || !email || !password || !confirm) {

        message.innerHTML =
            "⚠️ Please fill in all fields.";

        return;
    }


    if (password !== confirm) {

        message.innerHTML =
            "❌ Passwords do not match.";

        return;
    }


    if (password.length < 6) {

        message.innerHTML =
            "⚠️ Password must be at least 6 characters.";

        return;
    }


    message.innerHTML =
        "⏳ Creating account...";


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    artist_name: name

                }

            }

        });


    if (error) {

        message.innerHTML =
            "❌ " + error.message;

        return;
    }


    message.innerHTML =
        "✅ Account created successfully!";

}

// ================================
// SECTION NAVIGATION
// ================================

function openSection(section) {

    const sections =
        document.querySelectorAll(".mp-section");


    sections.forEach(item => {

        item.style.display = "none";

    });


    const selected =
        document.getElementById(
            "section-" + section
        );


    if (selected) {

        selected.style.display = "block";

    }


    if (section === "releases") {

        loadReleases();

    }


    if (section === "statistics") {

        loadStatistics();

    }

}


    } catch (error) {

        message.innerHTML =

            error.message;

    }

}


// ================================
// LOAD RELEASES
// ================================

async function loadReleases() {

    const container =
        document.getElementById("releaseList");


    if (!container) return;


    container.innerHTML =
        "<p>⏳ Loading releases...</p>";


    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        container.innerHTML =
            "<p>❌ Please login again.</p>";

        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("releases")
        .select("*")
        .eq("user_id", user.id)
        .order("created_at", {
            ascending: false
        });


    if (error) {

        container.innerHTML =
            "❌ " + error.message;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="mp-empty">

                <h3>
                    🎵 No releases yet
                </h3>

                <p>
                    Upload your first song.
                </p>

                <button
                    onclick="openSection('upload')">

                    Upload Music

                </button>

            </div>
        `;

        return;
    }


    container.innerHTML =
        data.map(release => `

            <div class="mp-release">

                <img
                    src="${escapeHTML(release.cover_url || "")}"
                    onerror="this.style.display='none';">

                <div>

                    <h3>
                        ${escapeHTML(release.song_title)}
                    </h3>

                    <p>
                        ${escapeHTML(release.artist_name)}
                    </p>

                    <p>
                        ${escapeHTML(release.release_type)}
                    </p>

                    <audio
                        controls
                        src="${escapeHTML(release.audio_url)}">
                    </audio>

                </div>

            </div>

        `).join("");

}


// ================================
// STATISTICS
// ================================

async function loadStatistics() {

    const stat =
        document.getElementById("statReleases");


    if (!stat) return;


    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) return;


    const {
        count,
        error
    } = await supabaseClient
        .from("releases")
        .select("*", {
            count: "exact",
            head: true
        })
        .eq("user_id", user.id);


    if (!error) {

        stat.innerHTML =
            count || 0;

    }

}

// ================================
// HELPERS
// ================================

function getExtension(filename) {

    const parts =
        filename.split(".");

    return parts.length > 1
        ? parts.pop().toLowerCase()
        : "file";

}


function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
