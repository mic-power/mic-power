<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC POWER - Upload Release</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            display: flex;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #111;
            border-right: 1px solid #222;
            padding: 25px 15px;
            position: fixed;
            left: 0;
            top: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .logo span {
            color: #00ff88;
        }

        .menu a {
            display: block;
            color: #bbb;
            text-decoration: none;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .menu a:hover {
            background: #00ff88;
            color: #000;
        }

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 35px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .box {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            background: #0e0e0e;
            color: white;
            border: 1px solid #333;
            border-radius: 7px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #00ff88;
        }

        .file-box {
            border: 2px dashed #333;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .file-box p {
            color: #888;
            margin-bottom: 15px;
        }

        .submit-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #00cc6d;
        }

        .message {
            margin-top: 20px;
            color: #00ff88;
            display: none;
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            MIC <span>POWER</span>
        </div>

        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="upload.html">Upload Music</a>
            <a href="#">My Music</a>
            <a href="#">Releases</a>
            <a href="#">Artists</a>
            <a href="#">Analytics</a>
            <a href="#">Payments</a>
            <a href="#">Settings</a>
        </div>

    </aside>


    <main class="main">

        <h1>Upload New Release</h1>

        <p class="subtitle">
            Submit your music release to MIC POWER.
        </p>


        <div class="box">

            <div class="form-group">
                <label>Artist Name</label>
                <input type="text" id="artist" placeholder="Enter artist name">
            </div>


            <div class="form-group">
                <label>Song / Release Title</label>
                <input type="text" id="title" placeholder="Enter song title">
            </div>


            <div class="form-group">
                <label>Release Type</label>

                <select id="type">
                    <option>Single</option>
                    <option>EP</option>
                    <option>Album</option>
                </select>
            </div>


            <div class="form-group">

                <label>Audio File</label>

                <div class="file-box">

                    <p>
                        Select your audio file
                    </p>

                    <input
                        type="file"
                        id="audio"
                        accept="audio/*"
                    >

                </div>

            </div>


            <button class="submit-btn" onclick="submitRelease()">
                Submit Release
            </button>

            <div class="message" id="message">
                ✓ Release information received successfully.
            </div>

        </div>

    </main>


    <script>

        function submitRelease() {

            const artist = document.getElementById("artist").value;
            const title = document.getElementById("title").value;
            const audio = document.getElementById("audio").files.length;

            if (artist === "" || title === "" || audio === 0) {

                alert("Please enter artist name, song title and select an audio file.");

                return;
            }

            document.getElementById("message").style.display = "block";
        }

    </script>

</body>
</html>
